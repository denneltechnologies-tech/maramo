name: DCO

on:
  pull_request:

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for c in $(git rev-list --no-merges "$base..$head"); do
            if ! git show -s --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "Missing Signed-off-by: $(git show -s --format='%h %s' "$c")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add a sign-off with: git commit -s  (or git rebase --signoff)"
            exit 1
          fi
